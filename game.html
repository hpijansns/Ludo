<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a13">
  <title>LUDO MASTER PRO - Arena</title>
  
  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    :root {
      --bg-space: #070a13;
      --bg-panel: #111827;
      --bg-card: #1f293d;
      --red: #e11d48;
      --red-dark: #9f1239;
      --blue: #2563eb;
      --green: #16a34a;
      --yellow: #eab308;
      --yellow-dark: #ca8a04;
      --gold: #fbbf24;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #1e293b, var(--bg-space));
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    #game-shell {
      width: 100vw;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 10px;
      gap: 6px;
      position: relative;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 24, 39, 0.85);
      border-radius: 12px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .room-badge {
      display: none;
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid #3b82f6;
      color: #93c5fd;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }
    .room-badge:active { transform: scale(0.95); }

    .coin-badge {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .screen {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }
    .screen.active { display: flex; }

    .lobby-box {
      width: 100%;
      max-width: 360px;
      background: rgba(17, 24, 39, 0.95);
      padding: 24px;
      border-radius: 18px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      margin-top: 15px;
    }

    .rejoin-card {
      display: none;
      background: rgba(34, 197, 94, 0.15);
      border: 1.5px solid #22c55e;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 6px;
      text-align: center;
    }

    .input-field {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }

    .btn-main {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    .btn-main:active { transform: scale(0.97); }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }

    .deck {
      width: 100%;
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s ease;
    }

    .deck.active-turn {
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.45);
      background: rgba(31, 41, 61, 0.98);
    }

    .player-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      position: relative;
    }

    .avatar-red { background: linear-gradient(135deg, var(--red), var(--red-dark)); }
    .avatar-yellow { background: linear-gradient(135deg, var(--yellow), var(--yellow-dark)); }

    .speaking-wave {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #22c55e;
      animation: micPulse 1.2s infinite;
      display: none;
    }
    .speaking .speaking-wave { display: block; }

    @keyframes micPulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .details h4 {
      font-size: 0.9rem;
      font-weight: 800;
    }

    .status-chip {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      background: rgba(0, 0, 0, 0.45);
      padding: 2px 6px;
      border-radius: 6px;
      margin-top: 2px;
      display: inline-block;
    }

    .turn-timer {
      font-size: 0.8rem;
      font-weight: 800;
      color: #38bdf8;
      margin-left: 6px;
      transition: color 0.2s ease;
    }

    .turn-timer.danger {
      color: #ef4444;
      animation: timerBlink 0.5s infinite alternate;
    }

    @keyframes timerBlink {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    .hearts-row {
      display: inline-flex;
      gap: 2px;
      margin-left: 6px;
      font-size: 0.75rem;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 700;
    }
    .ctrl-btn.active {
      background: #22c55e;
      border-color: #16a34a;
    }
    .ctrl-btn.muted {
      background: #ef4444;
      border-color: #dc2626;
    }

    .board-frame {
      width: min(94vw, 390px);
      height: min(94vw, 390px);
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75), 0 0 0 3px #334155;
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 16px;
    }

    .chat-strip {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(17, 24, 39, 0.85);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chat-emoji {
      font-size: 1.3rem;
      cursor: pointer;
    }
    .chat-emoji:active { transform: scale(1.3); }

    .floating-reaction {
      position: absolute;
      font-size: 2.8rem;
      z-index: 100;
      pointer-events: none;
      animation: floatUp 1.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(20px) scale(0.6); }
      20% { opacity: 1; transform: translateY(0) scale(1.2); }
      80% { opacity: 1; transform: translateY(-60px) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(0.8); }
    }

    .status-banner {
      font-size: 0.88rem;
      font-weight: 800;
      color: #38bdf8;
      text-align: center;
      min-height: 20px;
    }

    .dice-wrap {
      width: 46px;
      height: 46px;
      perspective: 300px;
    }

    .dice-cube {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 0 #94a3b8, 0 6px 12px rgba(0, 0, 0, 0.4);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 4px;
      cursor: pointer;
      position: relative;
    }
    .dice-cube:active { transform: translateY(3px); box-shadow: 0 1px 0 #94a3b8; }
    .dice-cube.rolling { animation: diceSpin 0.38s cubic-bezier(0.25, 1, 0.5, 1); }

    @keyframes diceSpin {
      0% { transform: rotateX(0deg) rotateY(0deg) scale(0.9); }
      50% { transform: rotateX(180deg) rotateY(180deg) scale(1.15); }
      100% { transform: rotateX(360deg) rotateY(360deg) scale(1); }
    }

    .dice-cube.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
      filter: grayscale(0.8);
    }

    .pip {
      width: 7px;
      height: 7px;
      background: #0f172a;
      border-radius: 50%;
      margin: auto;
      display: none;
    }

    .dice-cube[data-val="1"] .dp5 { display: block; background: #ef4444; width: 10px; height: 10px; }
    .dice-cube[data-val="2"] .dp1, .dice-cube[data-val="2"] .dp9 { display: block; }
    .dice-cube[data-val="3"] .dp1, .dice-cube[data-val="3"] .dp5, .dice-cube[data-val="3"] .dp9 { display: block; }
    .dice-cube[data-val="4"] .dp1, .dice-cube[data-val="4"] .dp3, .dice-cube[data-val="4"] .dp7, .dice-cube[data-val="4"] .dp9 { display: block; }
    .dice-cube[data-val="5"] .dp1, .dice-cube[data-val="5"] .dp3, .dice-cube[data-val="5"] .dp5, .dice-cube[data-val="5"] .dp7, .dice-cube[data-val="5"] .dp9 { display: block; }
    .dice-cube[data-val="6"] .dp1, .dice-cube[data-val="6"] .dp3, .dice-cube[data-val="6"] .dp4, .dice-cube[data-val="6"] .dp6, .dice-cube[data-val="6"] .dp7, .dice-cube[data-val="6"] .dp9 { display: block; }

    .chat-drawer {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 60vh;
      max-height: 420px;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(12px);
      border-top: 2px solid var(--gold);
      border-radius: 20px 20px 0 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
      padding: 12px;
    }
    .chat-drawer.open { bottom: 0; }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-weight: 800;
      color: var(--gold);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-bubble {
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 80%;
      font-size: 0.88rem;
      word-break: break-word;
    }
    .chat-bubble.mine {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
    }
    .chat-bubble.theirs {
      align-self: flex-start;
      background: #334155;
      color: #fff;
    }
    .chat-input-row {
      display: flex;
      gap: 6px;
      padding-top: 6px;
    }
  </style>
</head>
<body>

  <div id="game-shell">
    <div class="top-bar">
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="font-weight: 800; font-size: 0.9rem;" id="player-profile-name">Player</div>
        <div id="top-room-badge" class="room-badge" onclick="copyRoomCode()">ROOM: <span id="top-room-code">------</span> 📋</div>
      </div>
      <div class="coin-badge">🟡 <span id="player-coin-count">1000</span> Coins</div>
      <button type="button" class="ctrl-btn" style="background:#ef4444;" onclick="logout()">Logout</button>
    </div>

    <!-- Lobby Screen -->
    <div id="screen-lobby" class="screen active">
      <div class="lobby-box">
        <h2 style="color:var(--gold);">MATCHMAKING</h2>
        <p style="font-size:0.8rem; color:var(--text-muted);">Speed 15s • Fee: 100 Coins / Match</p>

        <!-- Rejoin Prompt -->
        <div id="rejoin-prompt" class="rejoin-card">
          <div style="font-size:0.85rem; color:#4ade80; font-weight:800; margin-bottom:6px;">⚡ Active Match Found!</div>
          <button type="button" class="btn-main" style="background:#16a34a; padding:9px;" onclick="resumeSavedMatch()">Rejoin Match Now</button>
        </div>

        <button type="button" class="btn-main btn-gold" id="btn-create-room" onclick="createRoom()">👑 CREATE ROOM</button>
        
        <div style="display:flex; gap:6px;">
          <input type="text" id="room-code-input" class="input-field" placeholder="Room Code">
          <button type="button" class="btn-main" style="width:110px;" onclick="joinRoom()">JOIN</button>
        </div>

        <div style="border-top:1px solid rgba(255,255,255,0.1); margin:4px 0;"></div>
        <button type="button" class="btn-main" style="background:#334155;" id="btn-play-comp" onclick="startOfflineMode()">🤖 PLAY VS COMPUTER</button>
      </div>
    </div>

    <!-- Active Game Screen -->
    <div id="screen-game" class="screen">
      <!-- Opponent Deck -->
      <div id="deck-yellow" class="deck">
        <div class="player-profile">
          <div id="avatar-yellow-box" class="avatar-circle avatar-yellow">
            🟡
            <div class="speaking-wave"></div>
          </div>
          <div class="details">
            <h4 id="name-yellow">Opponent</h4>
            <div>
              <span id="score-yellow" class="status-chip">0/4 Home</span>
              <span id="hearts-yellow" class="hearts-row">❤️❤️❤️</span>
              <span id="timer-yellow" class="turn-timer">15s</span>
            </div>
          </div>
        </div>
        <div class="dice-wrap">
          <div id="dice-yellow" class="dice-cube disabled" data-val="1">
            <div class="pip dp1" style="grid-area:1/1;"></div><div class="pip dp2" style="grid-area:1/2;"></div><div class="pip dp3" style="grid-area:1/3;"></div>
            <div class="pip dp4" style="grid-area:2/1;"></div><div class="pip dp5" style="grid-area:2/2;"></div><div class="pip dp6" style="grid-area:2/3;"></div>
            <div class="pip dp7" style="grid-area:3/1;"></div><div class="pip dp8" style="grid-area:3/2;"></div><div class="pip dp9" style="grid-area:3/3;"></div>
          </div>
        </div>
      </div>

      <div id="status-msg" class="status-banner">Game Ready!</div>

      <div class="board-frame">
        <canvas id="boardCanvas" width="600" height="600"></canvas>
      </div>

      <!-- Player Deck (Red) -->
      <div id="deck-red" class="deck active-turn">
        <div class="player-profile">
          <div id="avatar-red-box" class="avatar-circle avatar-red">
            🔴
            <div class="speaking-wave"></div>
          </div>
          <div class="details">
            <h4 id="name-red">You</h4>
            <div>
              <span id="score-red" class="status-chip">0/4 Home</span>
              <span id="hearts-red" class="hearts-row">❤️❤️❤️</span>
              <span id="timer-red" class="turn-timer">15s</span>
            </div>
          </div>
        </div>
        <div class="ctrl-group">
          <button type="button" id="mic-toggle-btn" class="ctrl-btn" onclick="toggleVoiceChat()">🎙️ Mic Off</button>
          <button type="button" id="speaker-toggle-btn" class="ctrl-btn" onclick="toggleSpeaker()">🔊 On</button>
          <button type="button" class="ctrl-btn" onclick="toggleChatDrawer()">💬 Chat</button>
          <div class="dice-wrap">
            <div id="dice-red" class="dice-cube" data-val="1">
              <div class="pip dp1" style="grid-area:1/1;"></div><div class="pip dp2" style="grid-area:1/2;"></div><div class="pip dp3" style="grid-area:1/3;"></div>
              <div class="pip dp4" style="grid-area:2/1;"></div><div class="pip dp5" style="grid-area:2/2;"></div><div class="pip dp6" style="grid-area:2/3;"></div>
              <div class="pip dp7" style="grid-area:3/1;"></div><div class="pip dp8" style="grid-area:3/2;"></div><div class="pip dp9" style="grid-area:3/3;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="chat-strip">
        <span class="chat-emoji" onclick="sendReaction('😂')">😂</span>
        <span class="chat-emoji" onclick="sendReaction('🔥')">🔥</span>
        <span class="chat-emoji" onclick="sendReaction('👑')">👑</span>
        <span class="chat-emoji" onclick="sendReaction('💀')">💀</span>
        <span class="chat-emoji" onclick="sendReaction('🚀')">🚀</span>
      </div>
    </div>
  </div>

  <!-- In-Game Chat Drawer -->
  <div id="chat-drawer" class="chat-drawer">
    <div class="chat-header">
      <span>ROOM CHAT</span>
      <button type="button" class="ctrl-btn" style="padding:2px 8px;" onclick="toggleChatDrawer()">✕</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-text-input" class="input-field" placeholder="Type message..." maxlength="70" style="margin-bottom:0;" onkeydown="if(event.key==='Enter') sendChatMessage()">
      <button type="button" class="btn-main" style="width:80px; padding:8px;" onclick="sendChatMessage()">Send</button>
    </div>
  </div>
